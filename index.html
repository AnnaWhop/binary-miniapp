<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>Binary Demo — Telegram Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#f6f7fb; --panel:#ffffff; --panel2:#f1f2f7; --line:#e6e8ef;
    --text:#1c1f2b; --muted:#7b8194; --accent:#6c4cf5; --accent2:#9b6bff;
    --up:#1aa66a; --up-d:#13905a; --down:#e5484d; --down-d:#cc3a3f;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:#e9ebf2;color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;height:100%}
  body{display:flex;justify-content:center;align-items:flex-start;padding:16px 0}
  .phone{width:390px;max-width:100%;min-height:780px;background:var(--bg);border-radius:28px;overflow:hidden;
    box-shadow:0 20px 60px rgba(30,30,60,.15);display:flex;flex-direction:column;position:relative}
  @media (max-width:430px){body{padding:0}.phone{border-radius:0;min-height:100vh;box-shadow:none}}

  .tg-head{display:flex;align-items:center;gap:10px;padding:14px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
  .logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center}
  .tg-head .title{flex:1;font-weight:700;font-size:16px}
  .tg-head .title small{display:block;color:var(--muted);font-weight:500;font-size:11px}
  .net{display:flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);padding:6px 10px;border-radius:999px;font-size:12px;font-weight:600}
  .net::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--up)}

  .top{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px}
  .asset-btn{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);color:var(--text);
    padding:8px 12px;border-radius:999px;font-size:14px;font-weight:700;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .asset-btn .ico{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;color:#fff}
  .asset-btn .pct{color:var(--accent);font-size:12px;font-weight:700}
  .balance{text-align:right}
  .balance .lbl{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;justify-content:flex-end;font-weight:500}
  .badge{background:#6c4cf51a;color:var(--accent);padding:2px 7px;border-radius:999px;font-size:10px;font-weight:700}
  .balance .val{font-size:20px;font-weight:800;letter-spacing:-.3px}

  .price-row{padding:4px 16px 10px;display:flex;align-items:baseline;gap:10px}
  .price{font-size:30px;font-weight:800;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
  .chg{font-size:13px;font-weight:700}
  .src{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);padding:4px 9px;border-radius:999px}
  .src::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
  .rtag{margin-left:6px;font-size:10px;font-weight:700;color:#b45309;background:#fef3c7;border:1px solid #fde68a;padding:1px 6px;border-radius:999px;vertical-align:2px}
  .src.rep{color:#b45309;background:#fef3c7;border-color:#fde68a} .src.rep::before{background:#f59e0b}
  .src.on{color:var(--up)} .src.on::before{background:var(--up);box-shadow:0 0 6px var(--up)}

  .chart-wrap{position:relative;margin:0 12px;height:290px;background:var(--panel);border-radius:20px;border:1px solid var(--line);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.04)}
  canvas{width:100%;height:100%;display:block}

  .controls{padding:12px 16px 6px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .ctl{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px}
  .ctl .lbl{font-size:11px;color:var(--muted);margin-bottom:6px;font-weight:600}
  .stepper{display:flex;align-items:center;justify-content:space-between}
  .stepper button{width:32px;height:32px;border-radius:50%;border:none;background:var(--panel2);color:var(--text);font-size:18px;font-weight:600;cursor:pointer}
  .stepper button:active{background:#e3e5ee}
  .stepper .v{font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .payout{grid-column:1/-1;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:2px 4px;font-weight:500}
  .payout b{color:var(--up)}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:6px 16px 14px}
  .act{border:none;border-radius:999px;padding:15px 0;font-size:16px;font-weight:800;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:transform .08s;box-shadow:0 6px 16px rgba(0,0,0,.08)}
  .act:active{transform:scale(.97)}
  .act small{font-weight:600;font-size:11px;opacity:.85}
  .act.up{background:linear-gradient(var(--up),var(--up-d))}
  .act.down{background:linear-gradient(var(--down),var(--down-d))}

  .tabs{display:flex;gap:4px;margin:0 16px;border-bottom:1px solid var(--line)}
  .tabs button{flex:1;border:none;background:none;color:var(--muted);padding:10px;font-size:14px;font-weight:700;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
  .list{padding:12px 16px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
  .empty{color:var(--muted);font-size:13px;text-align:center;padding:18px 0}
  .trade{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .trade .dir{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800}
  .trade .dir.u{background:#1aa66a1a;color:var(--up)} .trade .dir.d{background:#e5484d1a;color:var(--down)}
  .trade .info{flex:1;font-size:14px;font-weight:600}
  .trade .info .s{color:var(--muted);font-size:11px;margin-top:2px;font-weight:500}
  .trade .res{text-align:right;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums}
  .trade .res .s{color:var(--muted);font-weight:500;font-size:11px}
  .win{color:var(--up)} .lose{color:var(--down)}

  .sheet-bg{position:absolute;inset:0;background:rgba(20,20,40,.35);display:none;z-index:10}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--panel);border-radius:24px 24px 0 0;padding:10px 14px 20px;z-index:11;transform:translateY(100%);transition:transform .22s}
  .sheet::before{content:"";display:block;width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 12px}
  .sheet.open{transform:none}
  .sheet h3{font-size:16px;margin-bottom:10px;text-align:center}
  .opt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;cursor:pointer}
  .opt:hover,.opt.on{background:var(--panel2)}
  .opt .n{flex:1;font-weight:700}
  .opt .p{color:var(--accent);font-weight:700;font-size:13px}
  .opt .sub{color:var(--muted);font-size:12px;font-weight:500;font-variant-numeric:tabular-nums}
  .cico{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:12px;flex:none}
  .search{width:100%;border:1px solid var(--line);background:var(--panel2);border-radius:14px;padding:11px 14px;font:inherit;font-size:14px;color:var(--text);outline:none;margin-bottom:8px}
  .search:focus{border-color:var(--accent);background:#fff}
  .alist{max-height:58vh;overflow-y:auto;margin:0 -4px;padding:0 4px}
  .grp{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;padding:10px 12px 4px}

  .toast{position:absolute;left:50%;top:76px;transform:translateX(-50%) translateY(-20px);opacity:0;background:var(--text);color:#fff;
    padding:10px 16px;border-radius:999px;font-size:13px;font-weight:700;z-index:20;transition:.25s;white-space:nowrap;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  .toast.show{opacity:1;transform:translateX(-50%)}
  .toast.win{background:var(--up)} .toast.lose{background:var(--down)}
</style>
</head>
<body>
<div class="phone" id="app">
  <div class="tg-head">
    <div class="logo"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
    <div class="title">Binary Demo<small>Торговля прогнозами</small></div>
    <div class="net">Demo</div>
  </div>

  <div class="top">
    <button class="asset-btn" id="assetBtn">
      <span class="ico" id="assetIco"></span><span id="assetName"></span>
      <span class="pct" id="assetPayout"></span> ▾
    </button>
    <div class="balance">
      <div class="lbl"><span class="badge">DEMO</span>Баланс</div>
      <div class="val" id="balance">$10 000.00</div>
    </div>
  </div>

  <div class="price-row">
    <div class="price" id="price">—</div>
    <div class="chg" id="chg"></div>
    <div class="src" id="src">Симуляция</div>
  </div>

  <div class="chart-wrap"><canvas id="chart"></canvas></div>

  <div class="controls">
    <div class="ctl">
      <div class="lbl">Сумма</div>
      <div class="stepper"><button data-a="-">−</button><span class="v" id="amount">$100</span><button data-a="+">+</button></div>
    </div>
    <div class="ctl">
      <div class="lbl">Время</div>
      <div class="stepper"><button data-t="-">−</button><span class="v" id="time">30 сек</span><button data-t="+">+</button></div>
    </div>
    <div class="payout"><span>Доходность</span><span>Выплата: <b id="profit">+$85.00</b></span></div>
  </div>

  <div class="actions">
    <button class="act up" id="upBtn">▲ Выше<small>прогноз на рост</small></button>
    <button class="act down" id="downBtn">▼ Ниже<small>прогноз на падение</small></button>
  </div>

  <div class="tabs">
    <button class="on" data-tab="open">Открытые <span id="openCount"></span></button>
    <button data-tab="hist">История</button>
  </div>
  <div class="list" id="list"></div>

  <div class="sheet-bg" id="sheetBg"></div>
  <div class="sheet" id="sheet"><h3>Выберите актив</h3><input class="search" id="assetSearch" placeholder="Поиск: BTC, SOL, TON…" autocomplete="off"><div id="assetList" class="alist"></div></div>
  <div class="toast" id="toast"></div>
</div>

<script>
(() => {
  // ---------- Config ----------
  // sym = пара на Binance (USDT ≈ USD). Золото — токен PAXG (1 PAXG = 1 унция).
  // [тикер, цвет, примерная цена для симуляции]. Пара на Binance = тикер + USDT
  const COINS = [
    ['BTC','#f7931a',96500],['ETH','#627eea',3420],['BNB','#f3ba2f',640],['SOL','#9945ff',190],
    ['XRP','#23292f',2.3],['DOGE','#c2a633',0.38],['ADA','#0033ad',0.9],['TRX','#eb0029',0.25],
    ['TON','#0098ea',5.4],['AVAX','#e84142',38],['LINK','#2a5ada',18],['DOT','#e6007a',7],
    ['LTC','#345d9d',100],['BCH','#8dc351',450],['SHIB','#ffa409',0.000022],['NEAR','#00c08b',5.5],
    ['UNI','#ff007a',12],['APT','#06b6d4',10],['ARB','#28a0f0',0.8],['OP','#ff0420',2],
    ['SUI','#4da2ff',3.5],['PEPE','#3c9a3c',0.00002],['ATOM','#2e3148',7],['FIL','#0090ff',5],
    ['ETC','#328332',27],['XLM','#14b6e7',0.4],['ICP','#29abe2',10],['INJ','#00f2fe',25],
    ['AAVE','#b6509e',300],['WIF','#c69c6d',2.5],
  ];
  const REPLAY_SRC = ['NEAR'];   // монеты, которые показываются с задержкой
  const decFor = p => p>=100?2 : p>=1?3 : p>=0.01?5 : 8;
  const ASSETS = [
    ...COINS.flatMap(([id,color,start])=>{
      const a={id, sym:id+'USDT', name:id+'/USD', color, start, vol:0.0005, dec:decFor(start), payout:0.85, cat:'crypto'};
      if(!REPLAY_SRC.includes(id)) return [a];
      // источник скрыт из списка; вместо него — тот же актив с задержкой и пометкой «Повтор»
      return [{...a, hidden:true}, {id:id+'R', src:id, name:id+'/USD', color, start, vol:0, dec:a.dec, payout:0.85, cat:'crypto', replay:true, delay:120000}];
    }),
    {id:'EUR', sym:'EURUSDT',  name:'EUR/USD', color:'#3d8bfd', start:1.0835,vol:0.00006, dec:4, payout:0.82, cat:'fx'},
    {id:'XAU', sym:'PAXGUSDT', name:'GOLD',    color:'#d4af37', start:2650,  vol:0.00012, dec:2, payout:0.80, cat:'fx'},
  ];
  const REPLAY_MIN = 2;
  const REST = 'https://data-api.binance.vision/api/v3/klines';
  const WS   = 'wss://data-stream.binance.vision/stream?streams=';
  const AMOUNTS = [10,25,50,100,250,500,1000];
  const TIMES = [15,30,60,120,300];
  const TICK_MS = 500, HISTORY_POINTS = 240;

  // ---------- State ----------
  const S = { balance:10000, asset:ASSETS[0], amountIdx:3, timeIdx:1, open:[], hist:[], tab:'open', series:{},
              live:false, livePrice:{}, lastMsg:0 };

  // price simulation per asset (random walk with slight mean reversion)
  ASSETS.forEach(a => {
    const arr = []; let p = a.start;
    for (let i=0;i<HISTORY_POINTS;i++){ p = step(p,a); arr.push({t:Date.now()-(HISTORY_POINTS-i)*TICK_MS,p}); }
    S.series[a.id] = arr;
  });
  // буфер цен источника для повтора (последние ~10 минут)
  S.buf = {};
  function buildReplaySeries(){
    ASSETS.filter(a=>a.replay).forEach(a=>{
      const now=Date.now(); a.dec = ASSETS.find(x=>x.id===a.src).dec;
      S.series[a.id] = Array.from({length:HISTORY_POINTS},(_,i)=>{ const t=now-a.delay-(HISTORY_POINTS-1-i)*TICK_MS; return {t,p:priceAt(a.src,t)}; });
    });
  }
  function priceAt(src,t){
    const b=S.buf[src]; if(!b||!b.length) return last(src);
    let lo=0,hi=b.length-1; if(t<=b[0].t) return b[0].p;
    while(lo<hi){ const m=(lo+hi+1)>>1; if(b[m].t<=t) lo=m; else hi=m-1; }
    return b[lo].p;
  }
  ASSETS.filter(a=>a.replay).forEach(a=>{
    // в режиме симуляции: прошлое источника достраиваем, чтобы хватило на задержку
    const src=S.series[a.src], need=Math.ceil(a.delay/TICK_MS), pre=[]; let p=src[0].p;
    for(let i=need;i>0;i--){ p=step(p,ASSETS.find(x=>x.id===a.src)); pre.push({t:src[0].t-i*TICK_MS,p}); }
    S.buf[a.src]=pre.concat(src.map(o=>({...o})));
  });
  buildReplaySeries();
  function step(p,a){ const drift = (a.start-p)/a.start*0.002; return p*(1+drift+(Math.random()-0.5)*2*a.vol); }

  // ---------- Helpers ----------
  const $ = id => document.getElementById(id);
  const fmtMoney = v => '$'+v.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).replace(',', '.');
  const fmtP = (v,a=S.asset) => v.toLocaleString('en-US',{minimumFractionDigits:a.dec,maximumFractionDigits:a.dec});
  const fmtT = s => s<60 ? s+' сек' : (s/60)+' мин';
  const last = id => S.series[id][S.series[id].length-1].p;
  function haptic(type){ try{ window.Telegram?.WebApp?.HapticFeedback?.notificationOccurred(type); }catch(e){} }
  let toastTimer;
  function toast(msg,cls){ const t=$('toast'); t.textContent=msg; t.className='toast show '+(cls||''); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.className='toast',2000); }

  // ---------- UI render ----------
  function renderTop(){
    const a=S.asset;
    $('assetIco').style.background=a.color; $('assetIco').textContent=a.id[0];
    $('assetName').textContent=a.name; $('assetPayout').textContent=Math.round(a.payout*100)+'%';
    $('balance').textContent=fmtMoney(S.balance);
    $('amount').textContent='$'+AMOUNTS[S.amountIdx];
    $('time').textContent=fmtT(TIMES[S.timeIdx]);
    $('profit').textContent='+'+fmtMoney(AMOUNTS[S.amountIdx]*a.payout);
  }
  function renderPrice(){
    const arr=S.series[S.asset.id], p=arr[arr.length-1].p, p0=arr[0].p, d=(p-p0)/p0*100;
    $('price').textContent=fmtP(p);
    $('chg').textContent=(d>=0?'+':'')+d.toFixed(2)+'%';
    $('chg').className='chg '+(d>=0?'win':'lose');
    renderSrc();
  }
  function renderList(){
    $('openCount').textContent = S.open.length ? '('+S.open.length+')' : '';
    const el=$('list'); const now=Date.now();
    const items = S.tab==='open' ? S.open : S.hist.slice().reverse();
    if(!items.length){ el.innerHTML='<div class="empty">'+(S.tab==='open'?'Нет открытых сделок. Сделайте прогноз ▲ или ▼':'История пока пуста')+'</div>'; return; }
    el.innerHTML = items.map(tr=>{
      const a=ASSETS.find(x=>x.id===tr.asset);
      const dirCls = tr.dir==='up'?'u':'d', arrow = tr.dir==='up'?'▲':'▼';
      if(S.tab==='open'){
        const cur=last(tr.asset), left=Math.max(0,Math.ceil((tr.end-now)/1000));
        const winning = tr.dir==='up' ? cur>tr.entry : cur<tr.entry;
        return `<div class="trade"><div class="dir ${dirCls}">${arrow}</div>
          <div class="info">${a.name} · $${tr.amount}<div class="s">Вход ${fmtP(tr.entry,a)} · сейчас ${fmtP(cur,a)}</div></div>
          <div class="res ${winning?'win':'lose'}">${winning?'+'+fmtMoney(tr.amount*tr.payout):'−'+fmtMoney(tr.amount)}<div class="s">⏱ ${left} с</div></div></div>`;
      }
      return `<div class="trade"><div class="dir ${dirCls}">${arrow}</div>
        <div class="info">${a.name} · $${tr.amount}<div class="s">${fmtP(tr.entry,a)} → ${fmtP(tr.close,a)} · ${new Date(tr.end).toLocaleTimeString('ru-RU')}</div></div>
        <div class="res ${tr.win?'win':'lose'}">${tr.win?'+'+fmtMoney(tr.amount*tr.payout):'−'+fmtMoney(tr.amount)}<div class="s">${tr.win?'Выигрыш':'Проигрыш'}</div></div></div>`;
    }).join('');
  }

  // ---------- Chart ----------
  const cv=$('chart'), ctx=cv.getContext('2d');
  function resize(){ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=r.width*d; cv.height=r.height*d; ctx.setTransform(d,0,0,d,0,0); }
  window.addEventListener('resize',resize);
  function drawChart(){
    const W=cv.clientWidth, H=cv.clientHeight, padR=70, padT=16, padB=22;
    const a=S.asset, arr=S.series[a.id];
    const opens=S.open.filter(t=>t.asset===a.id);
    let min=Infinity,max=-Infinity;
    arr.forEach(o=>{min=Math.min(min,o.p);max=Math.max(max,o.p)});
    opens.forEach(t=>{min=Math.min(min,t.entry);max=Math.max(max,t.entry)});
    const pad=(max-min)*0.15||max*0.001; min-=pad; max+=pad;
    const x=i=>i/(arr.length-1)*(W-padR), y=p=>padT+(1-(p-min)/(max-min))*(H-padT-padB);
    ctx.clearRect(0,0,W,H);

    // grid + labels
    ctx.font='10px sans-serif'; ctx.textAlign='left';
    for(let i=0;i<=4;i++){
      const p=min+(max-min)*i/4, yy=y(p);
      ctx.strokeStyle='#eef0f5'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W-padR,yy); ctx.stroke();
      ctx.fillStyle='#9aa0b0'; ctx.fillText(fmtP(p),W-padR+6,yy+3);
    }
    // area
    const grad=ctx.createLinearGradient(0,padT,0,H);
    grad.addColorStop(0,'rgba(108,76,245,.22)'); grad.addColorStop(1,'rgba(108,76,245,0)');
    ctx.beginPath(); arr.forEach((o,i)=>i?ctx.lineTo(x(i),y(o.p)):ctx.moveTo(x(i),y(o.p)));
    ctx.lineTo(x(arr.length-1),H); ctx.lineTo(0,H); ctx.closePath(); ctx.fillStyle=grad; ctx.fill();
    // line
    ctx.beginPath(); arr.forEach((o,i)=>i?ctx.lineTo(x(i),y(o.p)):ctx.moveTo(x(i),y(o.p)));
    ctx.strokeStyle='#6c4cf5'; ctx.lineWidth=2.4; ctx.stroke();

    // open trade lines
    const now=Date.now(), lastT=arr[arr.length-1].t;
    opens.forEach(t=>{
      const yy=y(t.entry), c=t.dir==='up'?'#1aa66a':'#e5484d';
      ctx.setLineDash([5,4]); ctx.strokeStyle=c; ctx.lineWidth=1.2;
      ctx.beginPath(); ctx.moveTo(0,yy); ctx.lineTo(W-padR,yy); ctx.stroke(); ctx.setLineDash([]);
      // entry marker
      const idx=arr.findIndex(o=>o.t>=t.start); if(idx>=0){ ctx.fillStyle=c; ctx.beginPath(); ctx.arc(x(idx),yy,4,0,7); ctx.fill(); }
      // expiry vertical line (if fits in visible future area - shown at right edge with countdown)
      const left=Math.max(0,Math.ceil((t.end-now)/1000));
      ctx.fillStyle=c; ctx.fillRect(4,yy-16,74,14);
      ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif';
      ctx.fillText((t.dir==='up'?'▲ ':'▼ ')+'$'+t.amount+' · '+left+'с',8,yy-6);
    });

    // current price dot + tag
    const lp=arr[arr.length-1].p, ly=y(lp), lx=x(arr.length-1);
    ctx.fillStyle='#6c4cf5'; ctx.beginPath(); ctx.arc(lx,ly,4,0,7); ctx.fill();
    ctx.fillStyle='rgba(108,76,245,.2)'; ctx.beginPath(); ctx.arc(lx,ly,8+Math.sin(now/200)*2,0,7); ctx.fill();
    ctx.fillStyle='#6c4cf5'; ctx.fillRect(W-padR+1,ly-9,padR-2,18);
    ctx.fillStyle='#fff'; ctx.font='bold 10px sans-serif'; ctx.fillText(fmtP(lp),W-padR+5,ly+3);
  }
  function loop(){ drawChart(); requestAnimationFrame(loop); }

  // ---------- Trading ----------
  function placeTrade(dir){
    const amount=AMOUNTS[S.amountIdx];
    if(amount>S.balance){ toast('Недостаточно средств','lose'); haptic('error'); return; }
    S.balance-=amount;
    const now=Date.now(), a=S.asset;
    S.open.push({id:now+Math.random(), asset:a.id, dir, amount, payout:a.payout, entry:last(a.id), start:now, end:now+TIMES[S.timeIdx]*1000});
    toast((dir==='up'?'▲ Выше':'▼ Ниже')+' · $'+amount+' на '+fmtT(TIMES[S.timeIdx]));
    haptic('success'); renderTop(); renderList();
  }
  function settle(){
    const now=Date.now(); let changed=false;
    S.open = S.open.filter(t=>{
      if(now<t.end) return true;
      const close=last(t.asset), win = t.dir==='up' ? close>t.entry : close<t.entry;
      if(win) S.balance += t.amount + t.amount*t.payout;
      S.hist.push({...t, close, win}); changed=true;
      toast(win?('Выигрыш +'+fmtMoney(t.amount*t.payout)):('Проигрыш −'+fmtMoney(t.amount)), win?'win':'lose');
      haptic(win?'success':'error');
      return false;
    });
    if(changed) renderTop();
  }
  // ---------- Live data (Binance) ----------
  function setSource(live){ S.live=live; renderSrc(); }
  function renderSrc(){
    const el=$('src'); if(!el) return;
    if(S.asset.replay){ el.textContent='Повтор −'+REPLAY_MIN+' мин'; el.className='src rep'; return; }
    el.textContent = S.live ? 'Binance LIVE' : 'Симуляция';
    el.className = 'src '+(S.live?'on':'');
  }
  async function loadHistory(){
    const res = await Promise.allSettled(ASSETS.filter(a=>!a.replay).map(async a=>{
      if(ASSETS.some(r=>r.src===a.id)){
        const rb = await fetch(`${REST}?symbol=${a.sym}&interval=1s&limit=600`);
        if(rb.ok){ S.buf[a.id] = (await rb.json()).map(c=>({t:c[6], p:+c[4]})); }
      }
      const r = await fetch(`${REST}?symbol=${a.sym}&interval=1s&limit=${HISTORY_POINTS}`);
      if(!r.ok) throw new Error('http '+r.status);
      const k = await r.json();
      const arr = k.map(c=>({t:c[6], p:+c[4]}));
      // растягиваем 1-секундные свечи до шага графика (0.5с)
      S.series[a.id] = arr.flatMap(o=>[o,{t:o.t,p:o.p}]).slice(-HISTORY_POINTS);
      S.livePrice[a.id] = arr[arr.length-1].p;
      a.start = arr[arr.length-1].p; // чтобы при потере связи симуляция шла от реальной цены
      if(a.cat==='crypto') a.dec = decFor(a.start);
      a.live = true;
    }));
    if(!res.some(r=>r.status==='fulfilled')) throw new Error('no data');
    buildReplaySeries();
  }
  let ws, retry=0;
  function connectWS(){
    const streams = ASSETS.filter(a=>a.live).map(a=>a.sym.toLowerCase()+'@aggTrade').join('/');
    ws = new WebSocket(WS+streams);
    const failTimer = setTimeout(()=>{ if(!S.live){ try{ws.close()}catch(e){} } }, 6000);
    ws.onmessage = e=>{
      const m = JSON.parse(e.data), d = m.data; if(!d) return;
      const a = ASSETS.find(x=>x.sym===d.s); if(!a) return;
      S.livePrice[a.id] = +d.p; S.lastMsg = Date.now();
      if(!S.live){ clearTimeout(failTimer); setSource(true); retry=0; }
    };
    ws.onclose = ws.onerror = ()=>{
      clearTimeout(failTimer);
      if(S.live){ setSource(false); }
      if(retry++ < 5) setTimeout(connectWS, 3000*retry);   // переподключение
    };
  }
  async function startLive(){
    try{ await loadHistory(); renderPrice(); } catch(e){ /* нет доступа — остаёмся на симуляции */ return; }
    connectWS();
  }

  function tick(){
    // если поток молчит дольше 10с — считаем, что связь пропала
    if(S.live && Date.now()-S.lastMsg>10000) setSource(false);
    const now=Date.now();
    ASSETS.forEach(a=>{
      const arr=S.series[a.id], prev=arr[arr.length-1].p;
      if(a.replay){ arr.push({t:now,p:priceAt(a.src,now-a.delay)}); if(arr.length>HISTORY_POINTS) arr.shift(); return; }
      const p = (S.live && a.live && S.livePrice[a.id]) ? S.livePrice[a.id] : step(prev,a);
      if(!(S.live && a.live)) S.livePrice[a.id]=p;
      arr.push({t:now,p}); if(arr.length>HISTORY_POINTS) arr.shift();
      const b=S.buf[a.id]; if(b){ b.push({t:now,p}); while(b.length && b[0].t<now-600000) b.shift(); }
    });
    settle(); renderPrice(); renderList();
  }

  // ---------- Events ----------
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{ S.amountIdx=Math.max(0,Math.min(AMOUNTS.length-1,S.amountIdx+(b.dataset.a==='+'?1:-1))); renderTop(); });
  document.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{ S.timeIdx=Math.max(0,Math.min(TIMES.length-1,S.timeIdx+(b.dataset.t==='+'?1:-1))); renderTop(); });
  $('upBtn').onclick=()=>placeTrade('up');
  $('downBtn').onclick=()=>placeTrade('down');
  document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{
    S.tab=b.dataset.tab; document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('on',x===b)); renderList();
  });
  function openSheet(o){ $('sheet').classList.toggle('open',o); $('sheetBg').style.display=o?'block':'none'; }
  function renderAssetList(){
    const q=$('assetSearch').value.trim().toLowerCase();
    const items=ASSETS.filter(a=>!a.hidden && (!q || a.name.toLowerCase().includes(q)));
    const row=a=>{ const p=last(a.id), arr=S.series[a.id], d=(p-arr[0].p)/arr[0].p*100;
      return `<div class="opt ${a===S.asset?'on':''}" data-id="${a.id}">
      <span class="cico" style="background:${a.color}">${a.id.slice(0,a.id.length>3?2:1)}</span>
      <span class="n">${a.name}${a.replay?'<span class="rtag">Повтор</span>':''}<div class="sub">${fmtP(p,a)} <span class="${d>=0?'win':'lose'}">${d>=0?'+':''}${d.toFixed(2)}%</span></div></span>
      <span class="p">${Math.round(a.payout*100)}%</span></div>`; };
    const cr=items.filter(a=>a.cat==='crypto'), fx=items.filter(a=>a.cat==='fx');
    $('assetList').innerHTML = (cr.length?'<div class="grp">Криптовалюты</div>'+cr.map(row).join(''):'')
      + (fx.length?'<div class="grp">Валюты и металлы</div>'+fx.map(row).join(''):'')
      || '<div class="empty">Ничего не найдено</div>';
    document.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ S.asset=ASSETS.find(a=>a.id===o.dataset.id); openSheet(false); renderTop(); renderPrice(); });
  }
  $('assetSearch').oninput=renderAssetList;
  $('assetBtn').onclick=()=>{ $('assetSearch').value=''; renderAssetList(); openSheet(true); };
  $('sheetBg').onclick=()=>openSheet(false);

  // Telegram WebApp integration (works when opened inside Telegram)
  try{ const tg=window.Telegram?.WebApp; if(tg){ tg.ready(); tg.expand(); } }catch(e){}

  // ---------- Start ----------
  resize(); setSource(false); renderTop(); renderPrice(); renderList(); loop();
  setInterval(tick,TICK_MS);
  startLive();
})();
</script>
</body>
</html>
